[project]
name = "company-blog-rag"
version = "0.1.0"
description = "Query-type-aware RAG Q&A agent for a company blog"
authors = [{name = "Pablo Torres Pérez"}]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "langchain",
    "langchain-openai",
    "langchain-community",
    "langchain-chroma",
    "langgraph",
    "chromadb",
    "beautifulsoup4",
    "lxml",
    "requests",
    "pydantic-settings",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "mypy",
    "pre-commit",
    "types-requests",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]
per-file-ignores = {"tests/**" = ["S101"]}

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
disallow_any_generics = true
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

# .pre-commit-config.yaml
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.16
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.1.0
    hooks:
      - id: mypy
        additional_dependencies:
          [pydantic, pydantic-settings, fastapi, types-requests, requests, sqlalchemy,
           langchain-postgres==0.0.17, langchain-core==1.4.0, langchain-openai==1.2.2,
           langgraph==1.2.4]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: detect-private-key        # blocks accidental API key commits
      - id: check-added-large-files
        args: [--maxkb=500]           # blocks accidental chroma_db/ commit

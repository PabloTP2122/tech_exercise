services:
  - type: web
    name: bitovi-blog-rag-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: OPENAI_API_KEY
        sync: false          # set manually in Render dashboard (secret)
      - key: DATABASE_URL
        fromDatabase:
          name: bitovi-blog-rag-db
          property: connectionString  # auto-wired; scheme normalized in api/config.py

databases:
  - name: bitovi-blog-rag-db
    databaseName: blog_rag
    plan: free
    postgresMajorVersion: "16"
    # NOTE: pgvector extension must be enabled manually after DB is provisioned.
    # Run in Render DB shell: CREATE EXTENSION IF NOT EXISTS vector;
    # See spec/deploy/render.md Gotcha #3

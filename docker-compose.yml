services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: blog_rag
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d blog_rag"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    profiles: ["app"]          # NOT started by default; use --profile app or make up
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: "postgresql+psycopg://rag:rag@db:5432/blog_rag"
      OPENAI_API_KEY: "${OPENAI_API_KEY}"

volumes:
  pgdata:
